services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homelab-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1      # Allow container listing/actions
      - IMAGES=1          # Allow image pulling/checking
      - POST=1            # Allow start/stop/restart operations
      - INFO=1            # Allow Docker daemon info
      - NETWORKS=1        # Allow docker compose to manage networks
      - VOLUMES=1         # Allow docker compose to manage volumes
      - BUILD=1           # Allow compose build operations
    networks:
      - homelab-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-dashboard
    restart: unless-stopped
    # This container runs WITHOUT host privileges by default. Two features need more, and both are
    # opt-in through docker-compose.host-access.yml (see the README):
    #   - managing the Remote Desktop service on the host (privileged + host PID namespace)
    #   - discovering Cloudflare Tunnel configs stored on the host
    depends_on:
      - docker-proxy
    ports:
      - "${DASHBOARD_PORT:-8081}:8081"
    volumes:
      - ./data:/data
      - ../services:/services:ro
      - /proc:/host/proc:ro
    env_file:
      - ./backend/.env
    environment:
      - DOCKER_PROXY_URL=http://docker-proxy:2375
      - NODE_EXPORTER_URL=http://node-exporter:9100
      - DOCKER_HOST=tcp://docker-proxy:2375
      - DATA_DIR=/data
      - DATABASE_PATH=/data/homelab.db
      - HOST_ACCESS=false
    networks:
      - homelab-network
    labels:
      - "homepage.group=Management"
      - "homepage.name=HomeLab Dashboard"
      - "homepage.icon=dashboard.png"
      - "homepage.href=http://dashboard.local"
      - "homepage.description=Custom web-based HomeLab control plane dashboard"

networks:
  homelab-network:
    external: true
